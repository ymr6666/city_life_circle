# 城市时域生活圈分析系统 - Docker Compose 云部署 (docker-compose v1 / v2 兼容)
# 用法:
#   1. 将 deploy/data 随部署包放在项目根目录下 (含 city_life_circle.dump 与 pop_tiles/)
#   2. cd deploy/docker
#      docker-compose up -d --build        # 或新版: docker compose up -d --build
#   3. 访问 http://服务器IP:5000
#   评审结束一键删除(容器+数据卷+镜像): docker-compose down -v --rmi all
#
# 共存优化 (与游戏服务同一台机器):
#   - db 不映射 5432 到公网 (仅 compose 内网), 游戏服务器不受影响
#   - 容器加内存/CPU 上限 (mem_limit), 分析尖峰不会吃爆宿主机导致 MC 掉线
#   - app 映射 5000, 建议只在评审演示时于安全组放行 5000
version: "2.4"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: city-life-db
    environment:
      POSTGRES_DB: city_life_circle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # 首次启动自动建库并恢复全量备份 (数据卷已有数据时跳过)
      - ./db_init:/docker-entrypoint-initdb.d:ro
      - ../data/city_life_circle.dump:/docker-entrypoint-initdb.d/city_life_circle.dump:ro
      - db_data:/var/lib/postgresql/data
    # 数据库不对外暴露端口 (app 通过 compose 内网访问)
    # ports:
    #   - "5432:5432"
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d city_life_circle"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        # 天地图浏览器 key (可选, 留空自动回退 OSM); 通过 deploy/docker/.env 提供
        VITE_TIANDITU_KEY: "${VITE_TIANDITU_KEY:-}"
        # npm 镜像源 (国内服务器建议 https://registry.npmmirror.com)
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"
    container_name: city-life-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLC_DB_HOST: db
      CLC_DB_PORT: 5432
      CLC_DB_NAME: city_life_circle
      CLC_DB_USER: postgres
      CLC_DB_PASSWORD: postgres
      # 高德 Web 服务 key (可选, 缺失仅影响"搜索地址/逆地理编码")
      AMAP_KEY: "${AMAP_KEY:-}"
    volumes:
      # 人口密度瓦片 (只读挂载, 避免打进镜像)
      - ../data/pop_tiles:/app/cache/pop_tiles:ro
    ports:
      # 若只想通过 SSH 隧道访问, 改成 "127.0.0.1:5000:5000"
      - "5000:5000"
    mem_limit: 2g
    cpus: "1.0"
    restart: unless-stopped

volumes:
  db_data:
